<p>A YouTube embed:</p>
<iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?start=10" width="560" height="315" allowfullscreen></iframe>
<p>A privacy-enhanced YouTube embed, protocol-relative:</p>
<iframe src="//www.youtube-nocookie.com/embed/dQw4w9WgXcQ"></iframe>
<p>A Vimeo embed:</p>
<iframe src="https://player.vimeo.com/video/76979871?h=8272103f6e"></iframe>
<p>An embedded map, which isn't a video:</p>
<iframe src="https://maps.example/embed?q=Berlin"></iframe>
<p>A video file with a poster:</p>
<video src="https://media.example/clip.mp4" controls poster="https://images.example/poster.jpg"></video>
<p>A video file with sources and no poster:</p>
<video controls><source src="https://media.example/clip.webm" type="video/webm"><source src="https://media.example/clip.mp4" type="video/mp4"></video>
<p>A video with a relative source:</p>
<video src="/media/clip.mp4"></video>

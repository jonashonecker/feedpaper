name: Release

# Build the macOS binary and attach it to the GitHub release whenever a
# version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build binary
        run: pyinstaller --onefile --name feedpaper feedpaper/__main__.py

      - name: Rename binary for the release
        run: mv dist/feedpaper dist/feedpaper-macos

      - name: Attach binary to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/feedpaper-macos

name: Docs

# Lint the docs with Vale when the docs or their style change. Not a required check: Vale
# downloads its packages from GitHub releases without signing in, and those downloads
# fail now and then for reasons outside this repo.
on:
  push:
    branches: [main]
    paths: [README.md, "docs/**", .vale.ini, ".github/styles/**", .github/workflows/docs.yml]
  pull_request:
    paths: [README.md, "docs/**", .vale.ini, ".github/styles/**", .github/workflows/docs.yml]

permissions:
  contents: read

env:
  # A fixed version, so a check never depends on looking up the latest release.
  VALE_VERSION: 3.25.1

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Vale
        # Signed in with the workflow's token, which GitHub limits less than anonymous downloads.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${VALE_VERSION}" --repo vale-cli/vale --pattern "vale_${VALE_VERSION}_Linux_64-bit.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check the docs
        # Every finding becomes an annotation; only errors fail the check. GitHub shows only
        # the first few annotations of each level, so the job summary lists all of them, and
        # so does the log, where tools reading it through the API can find them.
        run: |
          vale --version
          # Downloading the packages sometimes times out, so try up to three times.
          for attempt in 1 2 3; do
            vale sync && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
          vale --output=JSON README.md docs > vale.json || true
          jq -r 'to_entries[] | .key as $file | .value[] |
            "::\(if .Severity == "error" then "error" elif .Severity == "warning" then "warning" else "notice" end) file=\($file),line=\(.Line),col=\(.Span[0])::[\(.Check)] \(.Message)"' vale.json
          {
            echo "## Vale: $(jq '[.[][]] | length' vale.json) finding(s)"
            echo
            echo "| Level | Where | Rule | Message |"
            echo "| --- | --- | --- | --- |"
            jq -r 'to_entries[] | .key as $file | .value[] |
              "| \(.Severity) | `\($file):\(.Line)` | \(.Check) | \(.Message | gsub("\\|"; "\\|")) |"' vale.json
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Vale findings (level, file:line, rule, message):"
          jq -r 'to_entries[] | .key as $file | .value[] |
            "  \(.Severity)\t\($file):\(.Line)\t\(.Check)\t\(.Message)"' vale.json
          test "$(jq '[.[][] | select(.Severity == "error")] | length' vale.json)" -eq 0

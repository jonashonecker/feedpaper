StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = feedpaper

Packages = Google, https://github.com/jdkato/diataxis/releases/latest/download/Diataxis.zip

[*.md]
BasedOnStyles = Vale, Google
# "chapter" is the correct term for ePub sections in an ebook, so allow it.
Google.WordListCase = NO

# One folder per Diátaxis type; each gets the matching style.
[docs/tutorial/*.md]
BasedOnStyles = Vale, Google, Tutorial

[docs/how-to/*.md]
BasedOnStyles = Vale, Google, HowTo

[docs/reference/*.md]
BasedOnStyles = Vale, Google, Reference, feedpaper

[docs/explanation/*.md]
BasedOnStyles = Vale, Google, Explanation

StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = feedpaper

# Fixed versions, like Vale itself in the workflow: a new package release can't turn the
# check red on its own.
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, https://github.com/jdkato/diataxis/releases/download/v0.1.0/Diataxis.zip

[*.md]
BasedOnStyles = Vale, Google
# "chapter" is the correct term for ePub sections in an ebook, so allow it.
Google.WordListCase = NO

# One folder per Diátaxis type; each gets the matching style.
[docs/tutorial/*.md]
BasedOnStyles = Vale, Google, Tutorial

[docs/how-to/*.md]
BasedOnStyles = Vale, Google, HowTo

[docs/reference/*.md]
BasedOnStyles = Vale, Google, Reference, feedpaper

[docs/explanation/*.md]
BasedOnStyles = Vale, Google, Explanation

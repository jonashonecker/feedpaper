[project]
name = "feedpaper"
version = "0.1.4"
description = "Build an ePub newspaper from unread Feedbin blog posts"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = [
    "pytest>=8.0",
    "pyright>=1.1.400",
    # Fixed for the snapshot tests: other versions may serialize HTML slightly
    # differently. Dependabot proposes updates, and the snapshots show what changed.
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
]

[project.scripts]
feedpaper = "feedpaper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["feedpaper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["feedpaper", "tests"]
pythonVersion = "3.10"
